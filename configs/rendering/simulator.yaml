# Standalone simulator configuration (used by scripts/run_simulator.py)

# Camera to use as the ego source trajectory. Empty -> first available camera.
start_camera_id: ""

# Initial frame index for ego trajectory and rigid timeline.
start_frame: 0
start_rigid_frame: 0

# Simulator mode: replay or user
mode: replay

# Time / loop
# Integration dt and render cap; effective tick is limited by rendering speed.
dt_sec: 0.1
max_fps: 10.0
loop_trajectory: true

# Dynamic rigid timeline behavior
rigid_paused: false
# In replay mode, whether rigid timeline also advances every tick.
advance_rigid_in_replay: true

# Rigid extrapolation past the baked span. When the training checkpoint carries
# fitted kinematic-bicycle params (Step 1.5), the rigid timeline can continue
# beyond the observed frames by rolling each vehicle's model forward. Only
# vehicles with a fitted model are extrapolated; others drop out past the span.
extrapolate_rigid: true
# Number of synthesized frames appended to the rigid timeline before it loops.
# 0 keeps baked-only playback (no extrapolation even if params are present).
rigid_extrap_frames: 0

# Bicycle model parameters
wheelbase_m: 0.5
max_steer_rad: 1.0
max_accel_mps2: 0.5
max_brake_mps2: 0.5
drag_per_sec: 0.6
max_speed_mps: 25.0

# Viewer
port: 8090
