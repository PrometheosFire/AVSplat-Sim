# Standalone rendering configuration
# Used by render_standalone.py for rendering trained models with trajectory shifts

# Model source (one of these must be provided)
ply_path: null             # Path to .ply file (primary, lightweight)
checkpoint_path: null      # Fallback for app_opt/post_processing

# Camera metadata directory (output from training: camera_paths/)
camera_paths_dir: null     # Required, set via override

# Output directory for rendered frames
output_dir: null           # Required, set via override

# Filter which cameras to render (empty = all cameras)
cameras_to_render: []

# Dynamic rigid objects (vehicles). They ANIMATE with the trajectory: each
# camera pose renders the vehicles at that frame's pose (frame i -> rigid i).
# Requires checkpoint_path, since rigid nodes are stored in the training
# checkpoint (not the PLY).
render_dynamic: true
# Optional bullet-time: hold all frames at this single rigid frame index instead
# of animating. null -> animate per camera pose.
freeze_timestep: null
# Debug: overlay each dynamic object's 3D box (semi-transparent, per-instance
# color) on the render to inspect box/reconstruction alignment.
debug_render_boxes: true

# Trajectory transformations
# Each shift is [x_m, y_m, z_m] in real-world meters:
#   x: lateral  (+ right, - left)
#   y: vertical (+ down,  - up)
#   z: longitudinal (+ forward, - backward)
# Names are auto-generated: [0.5,0,0] -> "X_0.5", [-0.5,0,0] -> "X_-0.5"
# All-zero entry -> "original"
trajectory:
  shifts:
    - [0, 0, 0]
    #- [-3, 0, 0]
    #- [3, 0, 0]

# Rendering parameters
render:
  sh_degree: 3
  near_plane: 0.01
  far_plane: 1e10
  save_video: true
  fps: 30
