# Disable viewer
#disable_viewer: false
# Render trajectory path: "interp", "ellipse", "spiral", or "raw" (use captured poses as-is)
render_traj_path: "raw"
# Downsample factor for the dataset
data_factor: 2

# Port for the viewer server
port: 8080

# Batch size for training. Learning rates are scaled automatically
batch_size: 1
# A global factor to scale the number of training steps
steps_scaler: 1.0

# Number of training steps
max_steps: 30_000
# Steps to evaluate the model
eval_steps: [7000, 30000]
# Steps to save the model
save_steps: [7000, 30000]

# Near plane clipping distance
near_plane: 0.01
# Far plane clipping distance
far_plane: 1e10

# Opacity regularization — pushes unsupervised Gaussians toward transparency
opacity_reg: 0.01
# Scale regularization — prevents Gaussians from growing too large
scale_reg: 0.01

# Strategy for GS densification, "default" or "mcmc"
strategy_type: "mcmc"  

# Use packed mode for rasterization, this leads to less memory usage but slightly slower.
packed: false
# Use sparse gradients for optimization. (experimental)
sparse_grad: false
# Use visible adam from Taming 3DGS. (experimental)
visible_adam: false

# Initialization strategy: "sfm" (COLMAP/lidar points), "random" (random volume)
init_type: "sfm"
# Number of random points (only used when init_type=random)
init_num_pts: 100_001

# Enable depth loss. (experimental)
depth_loss: false

# Every N images there is a test image 
test_every: 16


# ----------------------------------------------------------------- #
# Dynamic rigid objects (vehicles) — 4D extension                    #
# ----------------------------------------------------------------- #
# Master switch. When false, training is background-only (unchanged).
enable_dynamic: true
# Path to refined 3D tracks (track_3d_refined_colmap.json). Set per run.
dynamic_tracks_json: null
# Scene root holding the COLMAP reconstruction (<root>/colmap_sparse/rig).
dynamic_scene_root: null
# Rigid class names to keep (null -> vehicle group: car/truck/bus/...).
dynamic_rigid_classes: null
# Minimum tracking score to keep a box.
dynamic_min_track_score: 0.0
# Initial Gaussians sampled inside each instance box.
rigid_init_points_per_instance: 5000
# Percentage to widen each instance box FOOTPRINT by before training. Gaussians
# are only seeded inside the box (and are not clipped to it afterwards), so a
# box that hugs the body leaves mirrors, overhang and silhouette edges with
# nothing to start from. Only the ground-plane extents grow; HEIGHT is left
# alone so boxes do not sink into the road or reach above the roof. 0 disables.
rigid_bbox_expand_pct: 10.0
# Optimize the per-frame rigid poses during training. The poses sit in the
# render path, so when true the photometric loss moves every box independently
# with no kinematic constraint (rigid_smooth_w is 0). On scene_099 that drifted
# boxes ~0.30 m from the refined fit and made trajectories ~9x rougher, which
# smears the dynamic objects. False = trust the Step 1.5 bicycle-model fit.
rigid_pose_optimize: false
# Per-frame pose learning rates. Ignored unless rigid_pose_optimize is true.
rigid_pose_trans_lr: 0.0005
rigid_pose_quats_lr: 0.00001
# Final pose LRs for linear decay over training (OmniRe schedule).
# trans: 5e-4 -> 1e-4, quats: 1e-5 -> 5e-6.
rigid_pose_trans_lr_final: 0.0001
rigid_pose_quats_lr_final: 0.000005
# Temporal smoothness (2nd-order on translation) weight + window.
rigid_smooth_w: 0.0 #0.05
rigid_smooth_range: 5
# Opacity reset for rigid Gaussians every N steps (0 = off). Clamps every rigid
# Gaussian to opacity <= 0.01 so they have to re-compete via densification.
#
# TODO(measured harmful as configured — needs a sweep, see options below).
#
# The reset target is HARD-CODED at 0.01 (runner.py, "_max_logit"), which sits BELOW
# rigid_prune_opacity (0.02). So after every reset EVERY rigid Gaussian is a prune
# candidate, and the ones that cannot recover opacity fast enough are culled.
#
# Measured on scene_099 (~32 instances, 30k steps; multirun/2026-08-13/16-45-52 and
# the results/4dgs/wayve101/scene_099/20_gsplat_dynamic_* runs), at step 30k:
#
#   reset_every   instances kept   rigid Gaussians        val PSNR
#   0 (off)       31-32            ~999,000 (hits cap)    25.11
#   10000         28                997,474               23.83
#   3000 (here)   24-25             208k-405k             24.94
#
# It costs whole vehicles, suppresses rigid densification 2.5-5x, and ~0.17 dB.
# Judge by instance count / rigid Gaussian count, NOT PSNR: the within-setting PSNR
# spread (up to 1.3 dB) exceeds the between-setting difference.
#
# The binding constraint is the RECOVERY WINDOW, not this interval. The reset fires
# after the densifier, so the next prune pass is rigid_refine_every (100) steps
# later, and an instance only gets gradient on steps where it is rendered:
#   E[updates] = rigid_refine_every * (n_cameras * n_frames_of_instance / n_train)
# On scene_084 the survival boundary is ~8 expected updates (13-frame track: 6.9,
# died; 17-frame: 9.1, lived). That is why reset_every=10000 STILL lost 3 instances
# -- fewer resets, but the same 100-step window after each one.
#
# Options (do not just set 0 -- that discards the re-competition the reset provides):
#   A  rigid_reset_opacity_every: 0        config-only; measured best, but no re-compete
#   B  longer interval (e.g. 10000)        config-only; MEASURED INSUFFICIENT
#   C  rigid_prune_opacity: 0.005          config-only; UNTESTED, most promising --
#                                          puts the threshold below the reset target,
#                                          matching strategy.min_opacity for the bg
#   D  raise the reset target > prune      needs a code change (it is hard-coded)
#   E  raise rigid_refine_every            widens the window, slows densification
#   F  skip the prune pass after a reset   needs a code change; standard 3DGS practice
#
# Suggested: sweep rigid_reset_opacity_every x rigid_prune_opacity.
# See docs/03-scene-representation/rigid-gaussian-nodes.md sections 7.2.1-7.2.3.
rigid_reset_opacity_every: 3000
# Sharp-shape regularisation: penalise aspect ratio > ratio (OmniRe: w=1.0, every 10).
rigid_sharp_shape_w: 1.0
rigid_sharp_shape_ratio: 10.0
rigid_sharp_shape_every: 10
# Rigid densification (Default-3DGS-style on the 3D positional gradient).
rigid_grow_grad_thresh: 0.00005
rigid_grow_scale3d: 0.01
rigid_prune_opacity: 0.02
rigid_prune_scale3d: 0.5
# Hard cap on the TOTAL number of rigid Gaussians across all instances (VRAM).
rigid_cap_max: 1000000
# Debug: also save renders with per-instance 3D boxes overlaid (alignment check).
debug_render_boxes: true
# Export per-instance rigid PLYs with DC-only color (drop higher-order SH) so
# external viewers (SuperSplat) show flat color instead of the view-dependent
# rainbow SH artifact. false keeps full SH.
rigid_ply_dc_only: true
rigid_refine_start_iter: 500
rigid_refine_stop_iter: 25000
rigid_refine_every: 100
rigid_warmup_for_big_prune: 3000
rigid_cull_out_of_bound: true

# --- Pose smoothing strategy ---
# "finite_diff": 2nd-order translation smoothness (OmniRe-style, default).
# "unicycle":    HUGS kinematic regularizer (smooth accel/yaw + position anchoring).
# "bicycle":     RETIRED — superseded by the Step 1.5 refinement bicycle-model
#                fit (configs/pipeline/refine_tracks.yaml: bicycle_fit), which is
#                now the single source of kinematically-consistent vehicle poses.
#                Selecting it raises an error. Training consumes the refined
#                poses directly (rigid_smooth_w: 0.0 = no extra smoothing).
rigid_pose_smoothing: finite_diff #TODO REMOVE

# Unicycle smoother (only active when rigid_pose_smoothing: unicycle).
unicycle_opt_pos: true          # also optimize planar centers X/Z
unicycle_prefit_iters: 1000      # standalone pre-fit before 4DGS training (0=skip)
unicycle_prefit_reg_w: 5.0e-3
unicycle_prefit_pos_w: 1.0e-3
unicycle_joint_start_iter: 1000   # apply joint loss from this step
unicycle_joint_end_iter: 15000    # stop applying joint loss after this step
unicycle_joint_reg_w: 1.0e-3
unicycle_joint_pos_w: 1.0e-4
unicycle_lr_speed: 1.0e-3
unicycle_lr_heading: 1.0e-4
unicycle_lr_center: 1.0e-3

# Bicycle smoother — RETIRED (rigid_pose_smoothing: bicycle now raises). The
# kinematic bicycle fit lives in Step 1.5 refinement. These keys are kept inert
# only for backward-compatible config loading and have no effect.
bicycle_opt_pos: true
bicycle_prefit_iters: 500
bicycle_prefit_reg_w: 1.0e-2
bicycle_prefit_pos_w: 2.0e-4
bicycle_joint_start_iter: 1000
bicycle_joint_end_iter: 15000
bicycle_joint_reg_w: 5.0e-3
bicycle_joint_pos_w: 1.0e-5
bicycle_joint_couple_pos_w: 2.0e-3
bicycle_joint_couple_yaw_w: 3.0e-2
bicycle_yaw_anchor_w: 5.0e-3
bicycle_lr_speed: 1.0e-3
bicycle_lr_steer: 2.0e-4
bicycle_lr_center: 2.0e-4
bicycle_wheelbase_mode: fixed_from_bbox_long_edge
bicycle_wheelbase_alpha: 0.60


# ----------------------------------------------------------------- #
# Pseudo-view loop (Difix3D+)                                        #
# ----------------------------------------------------------------- #
# Surfaced here at their existing code defaults so every run RECORDS them.
# They were dataclass-only before, which meant a stored run's .hydra/config.yaml
# could not tell you the real-vs-pseudo weighting it trained with. Values are
# unchanged; only their visibility is.
#
# pseudo_manifests is NOT listed: the orchestrators inject it per round with
# ++gaussian_splatting.pseudo_manifests=... (run_difix_loop.py, run_difix_4dgs.py).
#
# Effective per-step weight is real 0.7*1.5 = 1.05 vs pseudo 0.3*0.3 = 0.09,
# i.e. ~11.7:1. real_loss_scale compensates real frames for the step budget lost
# to the pseudo stream, so pseudo supervision is additive rather than displacing.
# Both multipliers are INACTIVE when there is no pseudo bank.
pseudo_sample_prob: 0.3
pseudo_lambda: 0.3
real_loss_scale: 1.5

# Ablation knob ONLY, and inert as shipped: it gates the DefaultStrategy
# densification hook, while strategy_type below is "mcmc", whose densification
# reads opacity and the step counter and never the gradient. Setting it false
# under mcmc changes nothing -- that is not a bug, it is what the branch means.
# Pseudo-views still shape the Gaussian set under mcmc, via opacity through the
# optimizer, and no flag on the densification hook can gate that.
# (On the DefaultStrategy branch where it IS live it drops ~30% of refine ticks
# rather than deferring them, so it does not give a clean ablation there either.)
pseudo_densify: true

strategy:
  cap_max: 2000000        # Default cap
  min_opacity: 0.005        # Default pruning opacity

