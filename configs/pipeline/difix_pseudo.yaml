# configs/pipeline/difix_pseudo.yaml
#
# One round of the pseudo-view loop: clean a subset of the shifted renders with
# reference-conditioned Difix and emit the manifest the trainer consumes.
# Driven by scripts/run_difix_loop.py, which overrides the paths and the
# per-round stride/phase.

# Where the renders came from (<round>/render/<mode>), and the real-frame bank
# exported by src/gsplat_training/export_real_frames.py.
render_dir: null
real_bank_dir: null
output_dir: null

# Which frames to clean. Round r uses phase (r * 2), so successive rounds cover
# different timesteps: stride 6 with phases 0/2/4 gives {0,6,12,...},
# {2,8,14,...}, {4,10,16,...}. Validation frames are always excluded.
frame_stride: 6
frame_phase: 0

# Recorded in the manifest for provenance.
round: 0

# Did the renders being cleaned contain dynamic rigid objects (vehicles)?
#
# Recorded in the manifest, and it is the trainer's ONLY signal for whether to
# composite rigid nodes into a pseudo-view's render: PseudoViewDataset emits
# timestamp_us for dynamic entries, which is what makes
# Runner._resolve_rigid_frame_idx return a frame instead of None.
#
# This describes WHAT THE RENDERS CONTAINED, not what the next round intends to
# train. The two diverge on purpose in the dynamic loop's final_round mode,
# where a bank of static rounds feeds a dynamic final round -- those images have
# no vehicles, so the loss must not add any.
#
# Set by scripts/run_difix_4dgs.py. The static loop leaves it false.
dynamic: false

# Empty = every camera present in the render dir.
cameras: []

# Which shift levels to clean, as [x_m, y_m, z_m] triplets. Empty = every shift
# found under render_dir/frames. The loop renders ALL levels every round so
# successive rounds can be compared on identical trajectories, but cleans only
# the levels scheduled for that round -- this is what selects them. Matching is
# by value, so callers never reproduce render_standalone's shift naming.
shifts_m: []

# The zero shift is difixed and measured as a CONTROL (real ground truth exists
# there) but never enters the manifest. Its name is set by render_standalone's
# _shift_name for an all-zero shift.
control_shift_name: "original"

# Diffusion settings. The model itself comes from cfg.diffusion; the loop passes
# model@diffusion=difix_ref so that ref_image conditioning is active.
prompt: "remove degradation"
timestep: 199

# Re-clean frames whose output already exists (false = resume an interrupted run).
force: false
