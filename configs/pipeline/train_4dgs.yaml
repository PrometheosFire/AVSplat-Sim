# Step 20: 4D Gaussian Splatting training with dynamic rigid annotations.
# Consumes the refined tracks JSON (Step 15) together with the static ncore
# dataset (Step 3 of run_pipeline.py) and trains a 4DGS model in which the
# background is MCMC-densified and vehicles are rigid per-instance Gaussians
# driven by learnable per-frame SE(3) poses.
enabled: true

# Explicit ncore dataset directory (the 03_ncore_dataset_* folder produced by
# run_pipeline.py). When empty, the orchestrator auto-locates the most recent
# successful 03_ncore_dataset_* under results/<name>/<scene>/.
ncore_dataset_dir: ""
