# Step 1.5: track refinement (fuse split tracks, then filter static objects).
# Consumes the tracker's COLMAP-frame predictions and writes a refined JSON
# used for 4DGS training.
enabled: true

# Input resolution (the orchestrator sets input_dir to the tracking step dir).
#   input_dir:  <tracking_dir> -> reads eval/track_3d_predictions_colmap.json
#   input_json: explicit path (takes precedence if set)
input_dir: ""
input_json: ""

# Optional; used only to reconstruct the ego path for visualization.
data_root: ""

# --- Fusion (merge ID switches of the same physical object) ---
# Co-present overlap: two tracks sharing frames merge when their mean bird's
# eye IoU over the shared frames is >= iou_thr (distinct cars never overlap),
# OR when their centroids come within merge_dist meters in some shared frame
# (catches depth-jitter duplicates whose footprints miss but repeatedly
# coincide; distinct vehicles never get this close).
iou_thr: 0.3
merge_dist: 2.0
min_overlap_frames: 1
# Persistent proximity: tracks co-present for >= persistent_overlap_frames, OR
# where the shorter is >= containment_frac nested inside the longer (a fragment
# of it), whose median centroid distance stays <= persistent_merge_dist are the
# same object split by depth error (real neighbors drift apart -> high median).
persistent_overlap_frames: 15
persistent_merge_dist: 3.5
containment_frac: 0.7
# Divergence guard: two tracks that are co-present in some frame but ever
# separate by more than divergence_cap meters are distinct objects and are
# never placed in the same fused group — even transitively through a shared
# "hub" track. Real depth-split duplicates stay within ~6 m; distinct vehicles
# diverge to 10+ m.
divergence_cap: 6.0
# Gap handoff: a track that ends merges with one that starts within max_gap
# frames if the velocity-predicted position lands within gap_dist meters.
max_gap: 5
gap_dist: 2.0
# Class groups that may fuse together (handles e.g. pickups flickering between
# car/truck). Set to null for fully unrestricted cross-class fusion.
class_groups:
  - [car, truck, bus, trailer, construction_vehicle]
  - [bicycle, motorcycle]
  - [pedestrian]
  - [traffic_cone]
  - [barrier]

# Optional fusion-time pose gate on overlapping frames. Prevents bad duplicate
# boxes (wrong yaw/size/center) from overwriting a good canonical-id box when
# IDs are merged. If all candidates at an overlap frame are outliers and
# drop_if_all_outliers=true, the frame is left empty so fill_gaps can rebuild it.
fusion_pose_filter:
  enabled: true
  prefer_canonical: true
  # Loosened so early prefix/suffix frames of the same object are preserved
  # even when the canonical track is still several meters away during fusion.
  drop_if_all_outliers: false
  max_center_dist_m: 15.0
  max_yaw_deg: 25.0
  max_size_rel: 0.35
  # Yaw gate applies only to these classes (pedestrian-like classes are often
  # too noisy in yaw and are better filtered by center/size consistency).
  yaw_sensitive_classes:
    - car
    - truck
    - bus
    - trailer
    - construction_vehicle
    - bicycle
    - motorcycle

# --- Static filtering (drop parked / non-moving objects) ---
# Kept only if net ground displacement >= min_displacement meters and the track
# spans >= min_track_length frames.
#   displacement_mode: "net" = net travel (smoothed start->end), robust to box
#                      jitter so wobbling parked cars read ~0; "span" = legacy
#                      point-cloud diameter (jitter-inflated, keeps more).
#   displacement_smooth: frames averaged at each end for the net metric.
#   min_rel_displacement: also require travel >= this fraction of the object's
#                      distance from ego. Removes far static objects whose
#                      apparent motion is depth jitter (scales with range):
#                      static-far ~ 0.05, real movers ~ 0.13+. Higher = more
#                      aggressive but starts dropping genuine distant movers. 0
#                      disables.
min_displacement: 3.0
min_track_length: 3
displacement_mode: "net"
displacement_smooth: 3
min_rel_displacement: 0.0
displacement_percentile: 90.0

# --- Gap filling (make each kept track continuous within its lifespan) ---
# The tracker often drops individual frames; interpolate the missing boxes
# (linear position/size, SLERP rotation) between a track's first and last
# observed frame so the 4DGS rigid node renders without holes. Filled boxes are
# marked with "interpolated": true in the JSON.
fill_gaps: true
# End extension: extrapolate up to this many frames BEFORE the first / AFTER the
# last observed frame using constant ground-plane velocity (rotation & size
# held). Covers objects still visible in the fisheye view but no longer detected
# by the narrower-FOV tracker at frame edges / far range. 0 disables. Extended
# boxes are marked "extrapolated": true.
extend_frames: 5
extend_velocity_window: 3

# Pose smoothing: after gap-fill/extension, low-pass each track's per-frame
# translation with a centered moving average of this many frames to remove
# tracker position jitter (shaky rigid motion). Rotation & size are left
# untouched. 0 or 1 disables; larger = smoother but can round off sharp turns.
pose_smooth_window: 5
# Optional yaw-only rotation smoothing, applied after translation smoothing.
#   pose_smooth_rotation: master on/off switch (default off preserves current behavior).
#   pose_smooth_rotation_mode:
#     - "box_yaw": smooth the raw per-frame box yaw directly.
#     - "tangent_yaw": derive yaw from the local tangent of the already-smoothed
#       ground-plane trajectory, with fallback to box yaw when motion is tiny.
#   pose_smooth_rotation_window: centered moving-average window over yaw values;
#       if unset or <= 1 it effectively disables the smoothing pass.
#   pose_smooth_rotation_min_speed: minimum ground-plane speed (m/frame) needed
#       to trust the tangent heading in "tangent_yaw" mode.
pose_smooth_rotation: false
pose_smooth_rotation_mode: "tangent_yaw"
pose_smooth_rotation_window: 5
pose_smooth_rotation_min_speed: 0.05

# --- Interactive user refinement (post automatic refinement) ---
# If enabled, after the automatic refinement the terminal accepts commands:
#   Filter: <class>_<id>
#   Fuse: <class>_<id>, <class>_<id> [, ...]
#   Extend: <class>_<id>[, <int>]
#   Extend_stopped: <class>_<id>, <int>
#   Remove: <class>_<id>, <int>  (positive=end, negative=start)
#   undo
#   apply
#   done
# Each accepted modification writes a numbered snapshot under
# <refine_dir>/user_refinement/NNN/. When refinement finishes, the final tracks
# JSON, projection and bicycle_params.json are written to the <refine_dir> root,
# which is what all downstream stages (4DGS training, simulator) read.
user_refinement:
  enabled: false
  default_extend: 5
  extend_velocity_window: 3
  post_bicycle_fit: true
  # If true, when re-running with the SAME configs (same step-15 hash), the
  # interactive loop continues from the newest existing user_refinement snapshot
  # instead of restarting from the automatic-refinement base — so manual edits
  # from a previous session are preserved. Set false to always start fresh.
  resume_from_latest: true

# --- Kinematic bicycle-model fitting (vehicle classes) ---
# Replaces gap-fill + translation/rotation smoothing for vehicle-class tracks
# with a per-track kinematic bicycle-model fit (multiple-shooting batch MAP
# smoothing). The fitted trajectory is dense (gaps filled by the model rollout),
# denoised, and kinematically consistent (no sideways slides / impossible
# turns). Height (up axis) is kept from the tracker predictions; heading is
# written as a world-up yaw delta on the measured box rotation, on every frame
# (there is no speed threshold below which the measured yaw is kept instead).
# The fitted per-track parameters are written to bicycle_params.json so the
# simulator can extrapolate trajectories on demand.
bicycle_fit:
  enabled: true
  # Classes fitted with the bicycle model; everything else keeps the legacy
  # fill/extend/smooth path. Vehicle tracks shorter than min_track_frames also
  # fall back to the legacy path.
  classes: [car, truck, bus, trailer, construction_vehicle]
  min_track_frames: 3
  # --- Fit output representation & debug ---
  # Which fitted trajectory is written to the tracks and to everything downstream
  # (4DGS training boxes + simulator extrapolation). Both are fully supported;
  # they only differ when polish_single_shooting is false.
  #   "rollout" — integrate state0 + accel/steer. Exactly kinematically feasible
  #      and seam-free, but drifts off the detections when the fit's segment
  #      defects do not vanish (see .chats/session_bicycle_model_fitting.md §8.2).
  #      The sidecar carries only (state0, accel, steer).
  #   "states"  — the optimized per-frame X,Z (+ theta) straight from the
  #      multiple-shooting solve. Hugs the detections, but is stitched from
  #      segments, so it can kink at each segment boundary (every segment_len
  #      frames) — check refine_report.json -> bicycle_fit.tracks.*.states_seam_max
  #      (meters) for the worst kink per track, since sub-box discontinuities are
  #      what smear dynamic Gaussians. The sidecar additionally carries the
  #      per-frame states so the simulator reproduces the baked span exactly and
  #      only extrapolates with the model past the ends.
  bake_source: rollout
  # Single-shooting polish: after multiple shooting, re-fit (state0, controls)
  # against a pure single rollout so res.states == the baked rollout. TRUE makes
  # "states" and "rollout" identical; FALSE gives the genuinely different pair
  # (states hugs the detections; rollout is smooth / simulator-reproducible).
  polish_single_shooting: false
  polish_max_nfev: 400
  # Analytic Jacobian instead of scipy's finite differences. The FD path spends
  # one extra residual evaluation per Jacobian column group on EVERY solver
  # iteration (tens of them); the analytic one costs about a single evaluation
  # and is more accurate, so the fit is much faster at equal iteration count.
  # Set false to fall back to finite differences for an A/B on fit quality.
  analytic_jacobian: true
  # Debug: in each user_refinement_post_bicycle/NNN/, also write NNN/rollout/ and
  # NNN/states/ (tracks JSON + projected bboxes) to compare both representations
  # visually. Adds 2 extra projection renders per iteration.
  debug_bake_variants: true
  # Model-assisted fusion: when true, the velocity gap-handoff fusion signal
  # also tries a bicycle (constant-turn) extrapolation of the ending track, so a
  # vehicle that briefly disappears mid-corner is still matched to its
  # reappearance. Uses wheelbase_alpha / lr_ratio / dt below.
  model_assisted_gap: true
  # ====================================================================
  # Parameters below directly shape the per-track fit. Each notes the
  # effect of raising (^) vs lowering (v) it.
  # ====================================================================
  # Wheelbase L = wheelbase_alpha * max(size_x, size_y) (no direct measurement;
  # max() avoids width/length axis-order ambiguity).
  #   ^ longer wheelbase -> gentler turn per steer (straighter; can under-fit tight corners)
  #   v shorter wheelbase -> tighter turns allowed (can over-curve / wander)
  wheelbase_alpha: 0.45
  # CoG-to-rear-axle fraction lr / L (0.5 = box center).
  #   ^ CoG toward front -> more side-slip in curves | v toward rear -> less slip
  lr_ratio: 0.5
  dt: 0.1                # seconds per frame (fixed by frame rate; not a tuning knob)
  # Multiple-shooting segment length (frames).
  #   ^ fewer/longer segments -> better bake continuity but stiffer & less stable on curves
  #   v more/shorter segments -> more stable solve but more segment seams (bake drift; polish mitigates)
  segment_len: 51
  # Position residual normalizer (m); only the pos_scale : yaw_scale ratio matters.
  #   ^ trusts position LESS (looser/smoother, drifts off points) | v trusts position MORE (hugs obs, keeps noise)
  pos_scale: 0.5
  # Heading residual normalizer (rad) — a DIVISOR, i.e. inverse weight on yaw.
  #   ^ trusts yaw LESS (>=1e3 ~= ignore yaw) | v trusts yaw MORE (0 = divide-by-zero crash; floor ~0.05)
  yaw_scale: 1000000
  # Position robust (Huber) transition, in normalized residual units.
  #   ^ tolerates position outliers (they pull the fit more) | v rejects them sooner (more robust, may drop good pts)
  huber_delta: 1.345
  # One-sided penalty on NEGATIVE fitted speed, applied to every frame.
  # The model is exactly invariant under (theta -> theta+pi, v -> -v) for
  # straight-line motion, so "facing backwards while driving backwards" traces
  # the same path at no cost; the fit can slide into it and then has to swing the
  # heading around to stay on the observed path, which is the visible spinning.
  # Vehicles in these scenes never reverse, so that branch is pure degeneracy.
  # It is a true hinge: for v >= 0 the residual AND its derivative are exactly
  # zero, so positive or near-zero speeds are untouched (a genuine stop is free).
  # Measured on scene_099: reversing tracks reach -1.1 .. -2.9 m/s while
  # non-reversing ones bottom out at +0.4 m/s, so there is clear separation.
  #   ^ forces v >= 0 harder | v allows more reverse | 0 disables
  lambda_reverse: 10.0
  # --- Start-heading prior ---
  # Position data alone cannot pin the heading at the START of a track: the
  # model is invariant under (theta -> theta+pi, v -> -v) for straight-line
  # motion, and at low speed the motion tangent is noise. With yaw_scale large
  # (yaw effectively ignored) the solver is free to start a track facing
  # anywhere -> trajectories driven in reverse, or spinning for the first
  # seconds while the fit recovers the position. These anchor ONLY the leading
  # observations to the measured box yaw; the rest of the track stays
  # position-driven, so curve quality is unaffected.
  #   ^ start_yaw_frames: more frames anchored (too many re-introduces noisy yaw)
  #   v 0 disables the prior entirely
  start_yaw_frames: 5
  # Residual normalizer (rad) applied to the anchored frames only.
  #   ^ trusts the measured start yaw LESS | v trusts it MORE (floor ~0.05)
  start_yaw_scale: 0.15
  # Observations spanned when deriving the direction-of-travel reference used to
  # resolve the 180-degree front/back ambiguity of the measured box yaw.
  start_yaw_ref_obs: 15
  # Minimum net travel (m) over that span for the reference to be usable. Below
  # it the object is effectively stationary and has no defined heading, so the
  # prior is skipped.
  start_yaw_min_travel: 1.0
  # Skip the prior when the de-flipped measured yaw disagrees with the travel
  # direction by more than this - the box yaw is then simply wrong, and
  # anchoring to it would drag an otherwise good fit off course.
  #   ^ anchors more tracks (incl. dubious ones) | v only anchors confident ones
  start_yaw_max_dev_deg: 45.0
  # Heading robust (Cauchy) transition, normalized units (heavier tails than Huber).
  #   ^ tolerates yaw outliers | v rejects yaw outliers sooner
  cauchy_c: 2.3849
  # Robust re-weighting (IRLS) outer iterations.
  #   ^ stronger outlier down-weighting (slower) | v faster, less robust
  irls_iters: 3
  # --- Control-smoothness priors (the dominant regularizer) ---
  # Acceleration-change (jerk) smoothness.
  #   ^ smoother speed (too high rounds off real accel/brake) | v follows speed noise
  lambda_accel: 4.0
  # Steering-rate smoothness.
  #   ^ smoother heading (too high rounds off sharp turns) | v follows heading noise / wiggles
  lambda_steer: 6.0
  # Soft pull of acceleration toward 0.
  #   ^ biases toward constant speed | v freer speed changes
  lambda_accel_mag: 0.02
  # Soft pull of steering toward 0.
  #   ^ biases toward straight-line motion | v freer turning
  lambda_steer_mag: 0.05
  # Segment-continuity (defect) constraint weight.
  #   ^ tighter stitching (stiffer, worse conditioning) | v looser stitching (more stable solve, larger bake drift)
  defect_weight: 1000.0
  # |steering| bound (~40 deg), enforced by the solver.
  #   ^ allows tighter turns (risk of instability) | v caps turn rate (may under-fit sharp corners)
  max_steer: 0.7
  # Acceleration box bounds (m/s^2), enforced by the solver so one bad detection
  # cannot drive a non-physical speed runaway (comfort ~[-3, 2]; default allows hard braking).
  #   wider -> allows harder accel/brake (more runaway risk) | narrower -> more physical, may under-fit hard braking
  accel_min: -6.0
  accel_max: 4.0
  # --- Pre-cleaning of size-scaled detection artefacts (before fitting) ---
  # Large/elongated vehicles suffer two failures the kinematic model cannot
  # represent: 180-degree box heading flips (front/back ambiguity) and single-
  # frame lateral position spikes. Cleaning them before the fit is what lets big
  # vehicles (buses/trucks) pass the consistency gate instead of being rejected.
  preclean_yaw_flip: true       # point each heading along the motion direction
  preclean_min_move: 0.3        # min per-frame motion (m) to trust local heading
  preclean_outlier_dist: 2.0    # drop obs deviating > this (m) from neighbour interp; 0 disables
  # Gross bad first/last box (span anchor): the fit hard-anchors on the endpoints,
  # so a teleported first/last detection forces a non-physical speed/accel runaway
  # that corrupts the whole rollout. Drop an endpoint deviating > this (m) from a
  # linear extrapolation of its two inner neighbours (the fit rolls over the frame
  # and the bake repairs it). More lenient than the interior test since endpoint
  # extrapolation is noisier on curves. 0 disables.
  preclean_endpoint_dist: 3.0
  # Trimmed refit (least-trimmed squares): if the single-shoot rollout still
  # fails the consistency gate after pre-cleaning, iteratively drop the worst-
  # residual observations and refit before falling back to legacy smoothing.
  # Minimizes rejected tracks without loosening the gate.
  trim_refit: false
  trim_refit_iters: 3
  trim_refit_resid: 0.0         # per-frame drop threshold (m); 0 = use max_fit_pos_rmse
  # Per-solve function-eval cap for the trimmed refits. Bounds each fallback
  # solve so an under-constrained (trimmed) large track cannot grind for minutes
  # in the trust-region solver; a partial solve is acceptable for a fallback.
  trim_refit_max_nfev: 400
  # Consistency gate: the fitted trajectory that gets baked is a SINGLE
  # kinematic rollout from (state0, accel, steer) — identical to what the
  # simulator reproduces from the persisted params, and free of the
  # multiple-shooting segment-boundary jumps. If that rollout cannot follow the
  # observations within max_fit_pos_rmse meters (unconverged / noise-blown-up
  # fit, common on long or large-vehicle tracks) even after pre-clean +
  # trimmed refit, the bicycle fit is rejected and the track falls back to the
  # legacy fill/smooth path.
  max_fit_pos_rmse: 100.0
  # Parallelism for the per-track fits (independent solves). 0 = auto
  # (cpu_count-1, capped to the number of tracks); 1 = serial; N = N worker
  # processes. Output is identical regardless of worker count.
  fit_workers: 0

# --- Per-instance height plane fitting ---
# Run AFTER user refinement. For each vehicle track, fits Y = a·X + b·Z + c
# via RANSAC to the per-frame box centers, then replaces every frame's Y
# with the plane-predicted value. Removes tracker height jitter while
# preserving the vehicle's true elevation and any gentle slope along its path.
# Falls back to median Y for tracks with fewer than height_plane_min_inliers frames.
height_plane_fit: false
height_plane_outlier_thr: 0.5   # max |residual| in meters to count as inlier
height_plane_ransac_iters: 100  # number of random 3-point trials per track
height_plane_min_inliers: 3     # min frames for RANSAC; shorter tracks use median

# --- Visualization (BEV qualitative validation) ---
# The orchestrator renders raw and/or refined predictions per these toggles.
visualize:
  raw: true        # render BEV of the raw tracker output (pre-refinement)
  refined: true    # render BEV of the refined output (post-refinement)
  project: true    # project refined boxes back onto the camera frames
viz:
  ids: []          # empty = all tracks; else only these tracking ids
  classes: []      # empty = all; else only these class names
  color_by: "time" # time | id
  show_ego: true
  reference_camera: "front-forward"
  figsize: 14.0    # longer figure side (inches); short side follows data aspect
  margin: 5.0      # meters of padding around auto-fit bounds
  max_aspect: 4.0  # cap on figure long:short ratio (keeps elongated scenes legible)
  bounds: []       # optional [xmin, xmax, zmin, zmax] crop in COLMAP meters

# Set by the visualization entrypoint (orchestrator passes these per render).
viz_input_json: ""
viz_output_path: ""

# --- Projection onto frames (refined boxes drawn on the original images) ---
project:
  cameras: []       # empty = dataset.cameras; else subset to render
  box_width: 1      # cuboid line width in pixels
  subdiv: 12        # points per cuboid edge (higher = smoother fisheye curve)
  max_frames: 0     # 0 = every frame; else evenly subsample to this many
  max_view_angle: 80.0  # skip boxes with corners beyond this angle (deg) from
                        # the optical axis (too close/wide -> fisheye garbage)

# Set by the projection entrypoint (orchestrator passes these).
project_input_json: ""
project_output_dir: ""
