hydra:
  run:
    dir: results/manual_runs/${dataset.name}/${scene_name}/${exp_name}_${now:%m%d_%H%M}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - dataset.scene=scene_001,scene_025,scene_026
  job:
    name: run_pipeline
    chdir: null
    override_dirname: dataset.scene=scene_001,scene_025,scene_026
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/dinis-matos/workspace/AVSplat-Sim
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/dinis-matos/workspace/AVSplat-Sim/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      gaussian_splatting: train
      pipeline@diff_task: apply_diffusion
      pipeline@seg_task: extract_masks
      model@diffusion: difix3d+
      model@segmenter: sam3
      dataset: wayve101
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dataset:
  name: wayve101
  scene: scene_001
  base_dir: data/wayve101/${dataset.scene}
  cameras:
  - front-forward
  - left-backward
  - left-forward
  - right-backward
  - right-forward
segmenter:
  _target_: src.model_wrappers.segmenters.sam3_wrapper.SAM3Wrapper
  name: sam3
  checkpoint_path: external_weights/sam3/sam3.pt
  chunk_size: 2
diffusion:
  _target_: src.model_wrappers.diffusion.difix_wrapper.DifixWrapper
  name: difix
  model_id: nvidia/difix
  default_timestep: 199
seg_task:
  prompt: car, motorcycle, pedestrian, truck, vehicle
diff_task:
  prompt: remove degradation
  generate_videos: true
gaussian_splatting:
  render_traj_path: raw
  data_factor: 1
  port: 8080
  batch_size: 1
  steps_scaler: 1.0
  max_steps: 30000
  eval_steps:
  - 7000
  - 30000
  save_steps:
  - 7000
  - 30000
  near_plane: 0.01
  far_plane: 10000000000.0
  strategy_type: mcmc
  packed: false
  sparse_grad: false
  visible_adam: false
  depth_loss: false
  test_every: 8
  strategy:
    cap_max: 1000000
    min_opacity: 0.005
scene_name: ${dataset.scene}
exp_name: manual_debug_run
mask_processing:
  dilation_percentage: 0.2
  dilate_ego: false
